<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2BAC SM Archive - Cours, séries d'exercices et livres de Mathématiques et Physique-Chimie pour la 2ème année bac sciences mathématiques.">
  <title>2BAC SM Archive</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="#/" class="brand" data-link>
        <span class="logo">2B</span>
        <span>2BAC SM Archive</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="#/" data-link data-route="home">Accueil</a>
        <a href="#/math" data-link data-route="math">Mathématiques</a>
        <a href="#/physics" data-link data-route="physics">Physique &amp; Chimie</a>
        <a href="#/books" data-link data-route="books">Livres</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Changer de thème">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn hamburger" id="hamburger" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- PDF preview (native viewer) -->
  <div class="pdf-overlay" id="pdfOverlay" hidden>
    <div class="pdf-toolbar">
      <span class="pdf-title" id="pdfTitle">PDF</span>
      <div class="pdf-controls">
        <a class="pdf-tool" id="pdfDownload" title="Télécharger" aria-label="Télécharger">
          <i class="fas fa-download"></i>
        </a>
        <button class="pdf-tool" id="pdfClose" title="Fermer" aria-label="Fermer">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <div class="pdf-body">
      <div class="pdf-loading" id="pdfLoading"><i class="fas fa-spinner fa-spin"></i> Chargement du document...</div>
      <p class="pdf-error" id="pdfError" hidden>Impossible d'afficher ce document.</p>
      <div class="pdf-frame-wrap">
        <embed class="pdf-frame" id="pdfFrame" type="application/pdf">
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>2BAC SM Archive - Cours, séries d'exercices et livres pour sciences mathématiques</p>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="Retour en haut">
    <i class="fas fa-arrow-up"></i>
  </button>

  <div class="toast" id="toast"></div>

  <script src="static/index-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
