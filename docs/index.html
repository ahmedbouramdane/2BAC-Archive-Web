<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2BAC SM Archive - Cours, séries d'exercices et livres de Mathématiques et Physique-Chimie pour la 2ème année bac sciences mathématiques.">
  <meta name="theme-color" content="#2563eb">
  <title>2BAC SM Archive</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="#/" class="brand" data-link>
        <span class="logo">2B</span>
        <span>2BAC SM Archive</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="#/" data-link data-route="home">Accueil</a>
        <a href="#/math" data-link data-route="math">Mathématiques</a>
        <a href="#/physics" data-link data-route="physics">Physique &amp; Chimie</a>
        <a href="#/books" data-link data-route="books">Livres</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Changer de thème">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn hamburger" id="hamburger" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- PDF preview (PDF.js canvas renderer — works on mobile & WebView) -->
  <div class="pdf-overlay" id="pdfOverlay" hidden>
    <div class="pdf-toolbar">
      <span class="pdf-title" id="pdfTitle">PDF</span>
      <div class="pdf-controls">
        <button class="pdf-tool" id="pdfOpen" title="Ouvrir dans un navigateur" aria-label="Ouvrir dans un navigateur">
          <i class="fas fa-external-link-alt"></i>
        </button>
        <button class="pdf-tool" id="pdfClose" title="Fermer" aria-label="Fermer">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <div class="pdf-body">
      <div class="pdf-loading" id="pdfLoading"><i class="fas fa-spinner fa-spin"></i> Chargement du document...</div>
      <p class="pdf-error" id="pdfError" hidden>Impossible d'afficher ce document.</p>
      <div class="pdf-frame-wrap" id="pdfFrameWrap"></div>
    </div>
    <div class="pdf-navbar" id="pdfNavbar">
      <button class="pdf-tool" id="pdfZoomOut" title="Réduire" aria-label="Réduire">
        <i class="fas fa-minus"></i>
      </button>
      <button class="pdf-tool pdf-arrow" id="pdfPrev" title="Page précédente" aria-label="Page précédente">
        <i class="fas fa-chevron-left"></i>
      </button>
      <span class="pdf-pagenum" id="pdfPageInfo">1 / 1</span>
      <button class="pdf-tool pdf-arrow" id="pdfNext" title="Page suivante" aria-label="Page suivante">
        <i class="fas fa-chevron-right"></i>
      </button>
      <button class="pdf-tool" id="pdfZoomIn" title="Agrandir" aria-label="Agrandir">
        <i class="fas fa-plus"></i>
      </button>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">2 BAC Archive</div>
      <div class="footer-school">
        <i class="fas fa-school" aria-hidden="true"></i> Lydex de Rabat
      </div>
      <div class="footer-credit">
        Developed by <strong class="developer">Ahmed BOURAMDANE</strong>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="Retour en haut">
    <i class="fas fa-arrow-up"></i>
  </button>

  <div class="toast" id="toast"></div>
  <div class="offline-banner" id="offlineBanner" hidden>
    <i class="fas fa-wifi"></i> Vous êtes hors ligne — les documents nécessitent une connexion.
  </div>

  <script src="static/index-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });

      function updateOnlineState() {
        var banner = document.getElementById('offlineBanner');
        if (banner) banner.hidden = navigator.onLine;
      }
      window.addEventListener('online', updateOnlineState);
      window.addEventListener('offline', updateOnlineState);
      updateOnlineState();
    }
  </script>
</body>
</html>
