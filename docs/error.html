<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maintenance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #f5f5f5;
            --text: #222;
            --muted: #707070;
            --light: #e9e9e9;
            --accent: #3b82f6;
            --warning: #f59e0b;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            font-family: "Inter", sans-serif;

            background: var(--background);
            color: var(--text);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            overflow-x: hidden;
        }

        .content {
            width: 100%;
            max-width: 650px;

            text-align: center;

            animation: appear 0.7s ease-out;
        }

        /* Icon */

        .icon {
            width: 82px;
            height: 82px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e9e9e9;

            font-size: 36px;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* Status */

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 18px;

            color: #666;

            font-size: 13px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--warning);

            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        /* Heading */

        h1 {
            font-size: clamp(32px, 7vw, 52px);

            line-height: 1.15;

            letter-spacing: -1.5px;

            margin-bottom: 22px;

            color: #1f1f1f;
        }

        /* Description */

        .description {
            max-width: 570px;

            margin: 0 auto;

            font-size: 16px;
            line-height: 1.8;

            color: var(--muted);
        }

        /* Separator */

        .separator {
            width: 45px;
            height: 3px;

            margin: 32px auto;

            border-radius: 10px;

            background: var(--accent);
        }

        /* Footer */

        .thank-you {
            color: #888;

            font-size: 13px;
            line-height: 1.6;
        }

        /* Entrance */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Small phones */

        @media (max-width: 480px) {

            body {
                padding: 20px;
            }

            .icon {
                width: 70px;
                height: 70px;

                margin-bottom: 24px;

                font-size: 30px;
            }

            .status {
                font-size: 12px;
            }

            h1 {
                font-size: 31px;
                letter-spacing: -0.8px;

                margin-bottom: 18px;
            }

            .description {
                font-size: 14px;
                line-height: 1.75;
            }

            .separator {
                margin: 27px auto;
            }

            .thank-you {
                font-size: 12px;
            }
        }

        /* Very small screens */

        @media (max-width: 350px) {

            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="content">

        <div class="icon">
            ⚙️
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Maintenance in progress
        </div>

        <h1>
            We'll Be Back Soon
        </h1>

        <p class="description">
            The application is temporarily unavailable due to scheduled
            maintenance. The developer is working to resolve the issue
            as soon as possible.
        </p>

        <div class="separator"></div>

        <p class="thank-you">
            Thank you for your patience and understanding.
        </p>

    </main>

</body>
</html>
